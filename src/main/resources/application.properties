spring.application.name=real-estate-management

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:bdsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Hibernate - dùng create-drop cho H2 in-memory để data.sql luôn chạy đúng, tránh duplicate insert
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Date formatting
spring.mvc.format.date=yyyy-MM-dd

# TRÌ HOÃN CHẠY DATA.SQL CHO ĐẾN KHI HIBERNATE TẠO BẢNG XONG
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
